name: emerald-buildstream

min-version: 2.7

element-path: elements

(@):
- include/aliases.yml
- include/versions.yml

options:
  arch:
    type: arch
    description: Machine architecture
    variable: arch
    values:
    - x86_64
    - aarch64

sandbox:
  build-arch: '%{arch}'

variables:
  final-element: launcher/appimage.bst

plugins:
- origin: junction
  junction: plugins/buildstream-plugins-community.bst
  sources:
  - git_repo
  - git_module
