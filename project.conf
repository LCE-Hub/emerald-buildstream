name: emerald-buildstream

min-version: 2.8

element-path: elements

(@):
- include/aliases.yml
- include/versions.yml

options:
  arch:
    type: arch
    description: Machine architecture
    variable: arch
    values:
    - x86_64
    - aarch64

sandbox:
  build-arch: '%{arch}'

variables:
  final-element: elements/launcher/appimage.bst

plugins:
- origin: junction
  junction: plugins/buildstream-plugins.bst
  elements:
  - autotools
  - make
  - cmake
  sources:
  - patch
  - docker
- origin: junction
  junction: plugins/buildstream-plugins-community.bst
  elements:
  - cargo
  sources:
  - git_repo
  - git_module
  - cargo2
  - patch_queue

artifacts:
- url: https://cache.projectbluefin.io:11001
  connection-config:
    keepalive-time: 180
    retry-limit: 5
    retry-delay: 500
    request-timeout: 180
- url: https://gbm.gnome.org:11003
  connection-config:
    keepalive-time: 180
    retry-limit: 5
    retry-delay: 500
    request-timeout: 180

source-caches:
- url: https://cache.projectbluefin.io:11001
  connection-config:
    keepalive-time: 180
    retry-limit: 5
    retry-delay: 500
    request-timeout: 180
- url: https://gbm.gnome.org:11003
  connection-config:
    keepalive-time: 180
    retry-limit: 5
    retry-delay: 500
    request-timeout: 180
