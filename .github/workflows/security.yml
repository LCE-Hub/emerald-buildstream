name: security

on:
  push:
    branches: [main, init, radium]
  pull_request:
    branches: [main, init, radium]
  workflow_dispatch:

permissions: {}

jobs:
  workflow-lint:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install actionlint
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/.*actionlint-version: "\([^"]*\)".*/\1/p' include/versions.yml)
          SHA=$(sed -n 's/.*actionlint-sha256: "\([^"]*\)".*/\1/p' include/versions.yml)
          curl -fsSL -o /tmp/actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/actionlint_${VERSION}_linux_amd64.tar.gz"
          echo "${SHA}  /tmp/actionlint.tar.gz" | sha256sum -c -
          tar -xzf /tmp/actionlint.tar.gz -C /usr/local/bin actionlint

      - name: Validate workflows
        run: actionlint -color

      - name: Validate Renovate config
        run: |
          VERSION=$(sed -n 's/.*renovate-version: "\([^"]*\)".*/\1/p' include/versions.yml)
          npx --yes --package="renovate@${VERSION}" renovate-config-validator renovate.json

      - name: Audit workflows
        uses: zizmorcore/zizmor-action@1b4550e929643b8b26a62303c6bd64814271a4f1 # v0.9.2
        with:
          advanced-security: false
          inputs: .github/workflows
