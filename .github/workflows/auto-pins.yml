name: auto-pins

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [radium]
    paths: ['include/versions.yml']

permissions: {}

jobs:
  recompute:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.RENOVATE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Recompute sha256 pins
        run: python3 scripts/update_pins.py

      - name: Push pins to the PR branch
        run: |
          set -euo pipefail
          if git diff --quiet -- include/versions.yml; then
            echo "Pins are current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add include/versions.yml
          git commit -m "chore(deps): recompute sha256 pins"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
